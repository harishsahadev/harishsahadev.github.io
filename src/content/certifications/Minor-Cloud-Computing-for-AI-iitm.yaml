detailedDescription: "Awarded the Minor in Cloud Computing for AI from the IIT Madras BS Degree Program after successfully completing the required coursework, including Introduction to Big Data, Deep Learning Practice, and MLOps. The program provides practical knowledge of scalable AI systems, cloud-native machine learning workflows, distributed data processing, and modern MLOps practices for deploying and managing AI applications."