detailedDescription: "This certificate of appreciation recognizes successful completion of the workshop 'Future of Software Development with LLM: Spec Driven Development' conducted by the IIT Madras BS Degree Program. Learned the key differences between Vibe Coding and Spec Driven Development (SDD), and how specification-driven workflows improve reliability in AI-assisted software engineering. Gained hands-on experience with OpenSpec to iteratively define requirements, refine specifications, and build applications using Large Language Models. Successfully completed the workshop project by developing a basic application using the SDD methodology. The workshop was conducted on May 24, 2026."
